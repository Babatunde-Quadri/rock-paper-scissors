<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock, Paper, Scissors : The Game</title>
  </head>
  <body>
    <header>
      <h1 class="heading">ROCK PAPER SCISSORS</h1>
      <h2 class="subheading">First player to score 5 points wins the game</h2>
    </header>
    <main>
      <div class="score-board">
        <div class="player-scorecard scorecard">
          <p class="player-choice">Player</p>
          <p class="player-score">0</p>
        </div>
        <h3 class="current-round">Make a choice!</h3>
        <div class="cpu-scorecard scorecard">
          <p class="cpu-choice">Computer</p>
          <p class="cpu-score">0</p>
        </div>
      </div>
      <div class="main-section">
        <p class="round-result">Rock, Paper, Scissors. Shoot!</p>

        <div class="button-container">
          <button class="rock">✊</button>
          <button class="paper">✋</button>
          <button class="scissors">✌️</button>
        </div>
      </div>
    </main>
    <footer>
      <p>
        &copy; <span class="copyright-year">2026 </span>
        <a href="https://github.com/Babatunde-Quadri"
          >Babatunde Quadri
          <img
            src="asset/github-icon.png"
            height="24"
            width="auto"
            alt="Github Icon"
        /></a>
      </p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
