<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="button-container">
      <button class="rock">Rock</button>
      <button class="paper">Paper</button>
      <button class="scissors">Scissors</button>
    </div>

    <div class="gameBoard">
      <p class="current-round">Click a button to begin!</p>
      <p class="round-result">Rock, Paper, Scissors. Shoot!</p>
      <p class="game-score">Human: 0 | computer: 0</p>
    </div>

    <script>
      const currentRound = document.querySelector(".current-round");
      const roundResult = document.querySelector(".round-result");
      const gameScore = document.querySelector(".game-score");
      const buttons = document.querySelector(".button-container");

      function getComputerChoice() {
        let randomNumber = Math.floor(Math.random() * 3);
        if (randomNumber === 0) {
          return "rock";
        } else if (randomNumber === 1) {
          return "paper";
        } else {
          return "scissors";
        }
      }
      getComputerChoice();

      buttons.addEventListener("click", function (event) {
        if (gameOver) {
          return;
        }
        const humanChoice = event.target.className;
        const computerChoice = getComputerChoice();

        playRound(humanChoice, computerChoice);

        if (humanScore === 5 || computerScore === 5) {
          gameOver = true;
          currentRound.textContent = "Game Over! Refresh to play again.";
          roundResult.textContent = `Final Score - Human: ${humanScore} | Computer: ${computerScore}`;
          if (humanScore === 5) {
            gameScore.textContent = "🎉 Overall Winner: Human! 🎉";
          } else {
            gameScore.textContent = "💻 Overall Winner: Computer! 💻";
          }
        }
      });

      let humanScore = 0;
      let computerScore = 0;
      let gameRound = 0;
      let gameOver = false;

      function playRound(humanChoice, computerChoice) {
        gameRound++;
        currentRound.textContent = `Round ${gameRound}`;
        //humanChoice = humanChoice.toLowerCase();
        if (humanChoice === computerChoice) {
          roundResult.textContent = `It's a tie! Both chose ${humanChoice}`;
        } else if (
          (humanChoice === "rock" && computerChoice === "scissors") ||
          (humanChoice === "paper" && computerChoice === "rock") ||
          (humanChoice === "scissors" && computerChoice === "paper")
        ) {
          roundResult.textContent = `You win! ${humanChoice} beats ${computerChoice}`;
          humanScore++;
        } else if (
          (computerChoice === "rock" && humanChoice === "scissors") ||
          (computerChoice === "paper" && humanChoice === "rock") ||
          (computerChoice === "scissors" && humanChoice === "paper")
        ) {
          roundResult.textContent = `You lose! ${computerChoice} beats ${humanChoice}`;
          computerScore++;
        } else {
          const invalid = `Invalid input! you lose`;
          computerScore++;
          return invalid;
        }
        gameScore.textContent = `Game Score - Human: ${humanScore} | Computer: ${computerScore}`;
      }
    </script>
  </body>
</html>
